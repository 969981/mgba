name: Control RevA static Windows on UCRT64

on:
  push:
    branches:
      - revA-bootstrap
    paths:
      - .github/workflows/reva-win64-ucrt64-control.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ucrt64-control:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        lto: [ON, OFF]

    steps:
      - name: Checkout exact RevA source
        uses: actions/checkout@v4
        with:
          ref: fadbf93a565a5bd0b3e7f12b848fc208064a94f1
          fetch-depth: 0

      - name: Set up UCRT64 static toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt5-static
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-openssl

      - name: Configure UCRT64 static build
        shell: msys2 {0}
        env:
          LTO: ${{ matrix.lto }}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/qt5-static/bin:/ucrt64/bin:$PATH"

          mkdir -p /ucrt64/lib/.reva-hidden-import-libs
          for name in png16 ssl crypto zstd z SDL2 epoxy; do
            imp="/ucrt64/lib/lib${name}.dll.a"
            [[ -f "$imp" ]] && mv "$imp" /ucrt64/lib/.reva-hidden-import-libs/
          done

          cmake -S . -B build-ucrt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/ucrt64/qt5-static \
            -DQt5_DIR=/ucrt64/qt5-static/lib/cmake/Qt5 \
            -DFORCE_QT_VERSION=5 \
            -DCMAKE_EXE_LINKER_FLAGS='-static -static-libgcc -static-libstdc++' \
            -DDISTBUILD=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DBUILD_LTO=$LTO \
            -DBUILD_QT=ON \
            -DBUILD_SDL=ON \
            -DBUILD_GL=ON \
            -DBUILD_GLES2=OFF \
            -DBUILD_GLES3=OFF \
            -DUSE_EPOXY=ON \
            -DEPOXY_LIBRARIES=/ucrt64/lib/libepoxy.a \
            -DEPOXY_INCLUDE_DIRS=/ucrt64/include \
            -DUSE_ZLIB=ON \
            -DZLIB_LIBRARY=/ucrt64/lib/libz.a \
            -DZLIB_LIBRARY_RELEASE=/ucrt64/lib/libz.a \
            -DZLIB_INCLUDE_DIR=/ucrt64/include \
            -DUSE_PNG=ON \
            -DPNG_LIBRARY=/ucrt64/qt5-static/lib/libqtlibpng.a \
            -DPNG_LIBRARY_RELEASE=/ucrt64/qt5-static/lib/libqtlibpng.a \
            -DPNG_PNG_INCLUDE_DIR=/ucrt64/include \
            -DSDL2_LIBRARIES_TEMP=/ucrt64/lib/libSDL2.a \
            -DSDL2MAIN_LIBRARY=/ucrt64/lib/libSDL2main.a \
            -DUSE_MINIZIP=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_LIBZIP=OFF \
            -DUSE_LZMA=OFF \
            -DUSE_ELF=OFF \
            -DUSE_LUA=OFF \
            -DUSE_SQLITE3=OFF \
            -DUSE_JSON_C=OFF \
            -DUSE_DISCORD_RPC=OFF

      - name: Build and audit UCRT64 executable
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/qt5-static/bin:/ucrt64/bin:$PATH"
          cmake --build build-ucrt --target mgba-qt --parallel 2
          ls -lh build-ucrt/mGBA.exe
          objdump -p build-ucrt/mGBA.exe | awk '/DLL Name:/ {print $3}' | tee imports.txt
          if grep -Eqi '(Qt[56]|SDL2|libepoxy|libpng|zlib|libzstd|libgcc|libstdc\+\+|libwinpthread|libcrypto|libssl).*\.dll$' imports.txt; then
            echo 'Non-system runtime DLL import remains' >&2
            exit 1
          fi

      - name: Real-launch UCRT64 GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build-ucrt\mGBA.exe').Path
          $root = Split-Path $exe -Parent
          $oldPath = $env:PATH
          $p = $null
          try {
            $env:PATH = "$root;$env:WINDIR\System32;$env:WINDIR"
            $p = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
            Start-Sleep -Seconds 10
            $p.Refresh()
            if ($p.HasExited) { throw "UCRT64 FAIL: exited code $($p.ExitCode)" }
            Write-Host "UCRT64 PASS: alive after 10s; PID=$($p.Id); MainWindowHandle=$($p.MainWindowHandle)"
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            $env:PATH = $oldPath
          }
