name: Build FRLG RevA 3DS and Win32 fixes

on:
  push:
    branches:
      - revA-bootstrap
    paths:
      - .github/workflows/reva-platform-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  REV_SHA: fadbf93a565a5bd0b3e7f12b848fc208064a94f1
  RELEASE_TAG: revA-20260930

jobs:
  win32:
    name: Windows x86 SDL compatibility build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revA
          fetch-depth: 0
      - name: Verify source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '${{ env.REV_SHA }}') { throw 'revA moved' }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          suppress-deprecation-warnings: msystem-mingw32
          install: >-
            base-devel
            git
            p7zip
            mingw-w64-i686-cmake
            mingw-w64-i686-gcc
            mingw-w64-i686-pkgconf
            mingw-w64-i686-SDL2
            mingw-w64-i686-zlib
            mingw-w64-i686-libepoxy
            mingw-w64-i686-ntldd-git
      - name: Build compact SDL frontend
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cmake -S . -B build -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISTBUILD=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DBUILD_QT=OFF \
            -DBUILD_SDL=ON \
            -DBUILD_GL=OFF \
            -DBUILD_GLES2=OFF \
            -DBUILD_GLES3=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_MINIZIP=OFF \
            -DUSE_LIBZIP=OFF \
            -DUSE_PNG=OFF \
            -DUSE_EPOXY=ON \
            -DUSE_ELF=OFF \
            -DUSE_LUA=OFF \
            -DUSE_SQLITE3=OFF \
            -DUSE_JSON_C=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_LZMA=OFF \
            -DUSE_DISCORD_RPC=OFF
          cmake --build build --parallel 2
          test -f build/mgba-sdl.exe

          rm -rf portable
          mkdir portable
          cp build/mgba-sdl.exe portable/
          cp LICENSE README.md portable/

          dlls=$(ntldd -R "$PWD/portable/mgba-sdl.exe" | grep -i mingw | cut -d'>' -f2 | sed -e 's/(0x[0-9a-f]\+)//' -e 's/^ \+//' -e 's/ \+$//' -e 's,\\,/,g' || true)
          if [ -n "$dlls" ]; then cp -vu $dlls portable/; fi
          find portable -maxdepth 1 -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 | xargs -0 -r -n1 sh -c 'strip --strip-unneeded "$1" 2>/dev/null || true' _
          test -f portable/SDL2.dll
          7z a -t7z -mx=9 -ms=on mGBA-FRLG-RevA-win32-sdl.7z ./portable/*
          ls -lh mGBA-FRLG-RevA-win32-sdl.7z
      - name: Smoke test
        shell: pwsh
        run: |
          $old = $env:PATH
          try {
            $env:PATH = "$PWD\portable;C:\Windows\System32;C:\Windows"
            $p = Start-Process -FilePath (Join-Path $PWD 'portable\mgba-sdl.exe') -ArgumentList '--version' -WorkingDirectory (Join-Path $PWD 'portable') -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "mgba-sdl.exe failed: $($p.ExitCode)" }
          } finally { $env:PATH = $old }
      - uses: actions/upload-artifact@v4
        with:
          name: fix-win32
          path: mGBA-FRLG-RevA-win32-sdl.7z
          if-no-files-found: error

  n3ds:
    name: Nintendo 3DS Makefiles build
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revA
          fetch-depth: 0
      - name: Verify source
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$REV_SHA"
      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y cmake make p7zip-full
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev
      - name: Build with Unix Makefiles and package
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISTBUILD=ON \
            -DCMAKE_TOOLCHAIN_FILE=src/platform/3ds/CMakeToolchain.txt
          cmake --build build --parallel 2
          find build -type f \( -name '*.3dsx' -o -name '*.cia' \) -print

          rm -rf stage
          mkdir -p stage
          find build -type f \( -name '*.3dsx' -o -name '*.cia' \) -exec cp -v {} stage/ \;
          cp LICENSE README.md stage/
          test -n "$(find stage -maxdepth 1 -type f \( -name '*.3dsx' -o -name '*.cia' \) -print -quit)"
          7z a -t7z -mx=9 -ms=on mGBA-FRLG-RevA-3ds.7z ./stage/*
          ls -lh mGBA-FRLG-RevA-3ds.7z
      - uses: actions/upload-artifact@v4
        with:
          name: fix-3ds
          path: mGBA-FRLG-RevA-3ds.7z
          if-no-files-found: error

  publish:
    name: Attach fixed builds to Release
    runs-on: ubuntu-latest
    needs: [win32, n3ds]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fix-*
          path: assets
          merge-multiple: true
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          find assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          for f in assets/*; do
            gh release upload "$RELEASE_TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
