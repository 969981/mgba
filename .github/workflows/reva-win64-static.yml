# RevA Windows release pipeline v7: official mGBA windows:w64 Docker toolchain
name: Build and publish FRLG RevA official Windows x64

on:
  push:
    branches:
      - revA-bootstrap
    paths:
      - .github/workflows/reva-win64-static.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reva-win64-official-docker
  cancel-in-progress: true

env:
  RELEASE_TAG: revA-20260930
  EXPECTED_REVA: fadbf93a565a5bd0b3e7f12b848fc208064a94f1
  OFFICIAL_IMAGE: mgba/windows:w64
  BUILD_DIR: build-win64-official
  ASSET_NAME: mGBA-FRLG-RevA-win64.7z

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RevA source
        uses: actions/checkout@v4
        with:
          ref: fadbf93a565a5bd0b3e7f12b848fc208064a94f1
          fetch-depth: 0

      - name: Verify exact RevA source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_REVA"
          test -z "$(git status --porcelain)"
          git log --oneline --decorate -3

      - name: Pull official mGBA Windows x64 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$OFFICIAL_IMAGE"
          docker inspect "$OFFICIAL_IMAGE" --format='{{index .RepoDigests 0}}'

      - name: Build with official mGBA Windows x64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          chmod 777 "$BUILD_DIR"

          # Mirrors the official mGBA Buildbot Windows configuration:
          # mgba/windows:w64, static distribution, Qt+SDL+FFmpeg enabled,
          # LTO disabled, and the official CMake toolchain supplied by the image.
          CMAKE_FLAGS='-DDISTBUILD=ON -DCMAKE_BUILD_TYPE=Release -DCPACK_PACKAGE_FILE_NAME=build -DBUILD_PERF=OFF -DBUILD_SDL=ON -DBUILD_QT=ON -DUSE_FFMPEG=ON -DBUILD_LTO=OFF -DBUILD_STATIC=ON -DBUILD_SHARED=OFF -DM_CORE_DS=ON -DBUILD_PYTHON=OFF -DBUILD_SUITE=OFF -DINSTALLER_NAME=build-installer'

          docker run --rm \
            -e "BUILD_DIR=$BUILD_DIR" \
            -e "CMAKE_FLAGS=$CMAKE_FLAGS" \
            -e MAKEFLAGS=-j3 \
            -v "$PWD:/home/mgba/src" \
            "$OFFICIAL_IMAGE"

          # Keep the build tree owned by the same container user until CPack
          # has finished. The official Buildbot also runs build -> cpack before
          # its permission-cleanup step.
          test -f "$BUILD_DIR/mGBA.exe"
          test -f "$BUILD_DIR/mgba-sdl.exe"
          ls -lh "$BUILD_DIR/mGBA.exe" "$BUILD_DIR/mgba-sdl.exe"

      - name: Generate official CPack components
        shell: bash
        run: |
          set -euo pipefail

          # Run CPack as the same `mgba` container user that created the build
          # tree. If preinstall fails, print its real log before the container
          # exits so the next failure is directly actionable.
          docker run --rm \
            -w "/home/mgba/src/$BUILD_DIR" \
            -v "$PWD:/home/mgba/src" \
            "$OFFICIAL_IMAGE" \
            bash -lc 'cpack -V -G TXZ || { echo "==== CPack PreinstallOutput.log ===="; find _CPack_Packages -name PreinstallOutput.log -print -exec cat {} \; 2>/dev/null || true; exit 1; }'

          # Match the official Buildbot ordering: permissions are relaxed only
          # after CPack has completed, never between build and preinstall.
          docker run --rm \
            -w "/home/mgba/src/$BUILD_DIR" \
            -v "$PWD:/home/mgba/src" \
            "$OFFICIAL_IMAGE" \
            bash -lc 'chmod -fR go+w *'

          sudo chown -R "$(id -u):$(id -g)" "$BUILD_DIR"
          for archive in build-base.tar.xz build-sdl.tar.xz build-qt.tar.xz; do
            test -f "$BUILD_DIR/$archive" || {
              echo "Expected official CPack component missing: $archive" >&2
              find "$BUILD_DIR" -maxdepth 2 -type f -printf '%p\n' | sort
              exit 1
            }
            ls -lh "$BUILD_DIR/$archive"
          done

      - name: Assemble official release tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package-official
          mkdir package-official

          for archive in build-base.tar.xz build-sdl.tar.xz build-qt.tar.xz; do
            tar -xJf "$BUILD_DIR/$archive" -C package-official
          done

          qt_exe="$(find package-official -type f -iname 'mGBA.exe' -print -quit)"
          sdl_exe="$(find package-official -type f -iname 'mgba-sdl.exe' -print -quit)"
          test -n "$qt_exe"
          test -n "$sdl_exe"

          echo "Qt frontend:  $qt_exe"
          echo "SDL frontend: $sdl_exe"
          echo '==== Official release tree ===='
          find package-official -maxdepth 3 -type f -printf '%10s  %p\n' | sort -nr | head -100

      - name: Create official-style 7z
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          rm -f "$ASSET_NAME"

          # Same 7z method used by mGBA's Buildbot packaging.
          (
            cd package-official
            7z a -t7z -m0=lzma -mx=9 -mfb=64 -md=32m -ms=on "../$ASSET_NAME" .
          )

          ls -lh "$ASSET_NAME"
          sha256sum "$ASSET_NAME"

      - name: Upload official-toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-FRLG-RevA-win64-official
          path: mGBA-FRLG-RevA-win64.7z
          if-no-files-found: error

  verify-publish:
    needs: build
    runs-on: windows-2022
    steps:
      - name: Download official-toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: mGBA-FRLG-RevA-win64-official
          path: artifact

      - name: Extract package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $PWD "artifact\$env:ASSET_NAME"
          if (-not (Test-Path $asset)) { throw "Asset missing: $asset" }

          Remove-Item smoke -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path smoke | Out-Null
          & 7z x $asset '-osmoke' -y
          if ($LASTEXITCODE -ne 0) { throw '7z extraction failed' }

          Get-ChildItem smoke -Recurse -File |
            Sort-Object Length -Descending |
            Select-Object -First 100 Length,FullName |
            Format-Table -AutoSize

      - name: Real-launch test on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem smoke -Recurse -File -Filter 'mGBA.exe' | Select-Object -First 1
          if (-not $exe) { throw 'mGBA.exe not found in official-toolchain archive' }

          $root = $exe.Directory.FullName
          $oldPath = $env:PATH
          $p = $null
          try {
            $env:PATH = "$root;$env:WINDIR\System32;$env:WINDIR"
            $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $root -PassThru
            Start-Sleep -Seconds 10
            $p.Refresh()

            if ($p.HasExited) {
              $code = $p.ExitCode
              throw ("mGBA GUI exited early: {0} / 0x{1:X8}" -f $code, [uint32]$code)
            }
            if ($p.MainWindowHandle -eq 0) {
              throw 'mGBA process stayed alive but did not create a main window'
            }
            Write-Host "GUI launch gate passed: PID=$($p.Id) MainWindowHandle=$($p.MainWindowHandle)"
          } finally {
            if ($p -and -not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
            $env:PATH = $oldPath
          }

          $sdl = Get-ChildItem smoke -Recurse -File -Filter 'mgba-sdl.exe' | Select-Object -First 1
          if (-not $sdl) { throw 'mgba-sdl.exe not found in official-toolchain archive' }
          $sdlp = Start-Process -FilePath $sdl.FullName -ArgumentList '--version' -WorkingDirectory $sdl.Directory.FullName -Wait -PassThru
          if ($sdlp.ExitCode -ne 0) { throw "mgba-sdl.exe --version exited $($sdlp.ExitCode)" }

      - name: Publish verified Windows package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '969981/mgba'
          $tag = $env:RELEASE_TAG
          $asset = Join-Path $PWD "artifact\$env:ASSET_NAME"

          $tagSha = (gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha').Trim()
          if ($tagSha -ne $env:EXPECTED_REVA) {
            throw "Tag $tag points to $tagSha, expected $env:EXPECTED_REVA"
          }

          gh release upload $tag $asset --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }

          gh release edit $tag --repo $repo --notes 'FRLG RevA multi-platform release. Windows x64 is built from the exact RevA commit with the official mGBA mgba/windows:w64 Docker toolchain and the same Windows Buildbot distribution flags: static build, Qt/SDL/FFmpeg enabled, LTO disabled, and official CPack base/SDL/Qt components merged before 7z packaging. The Windows asset is published only after the resulting archive is extracted and the GUI is actually launched on a clean Windows Server runner. Includes the SWI 0x48 FireRed/LeafGreen RevA save fix.'
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed' }

          Get-FileHash $asset -Algorithm SHA256 | Format-Table -AutoSize
          Get-Item $asset | Select-Object Name,Length | Format-Table -AutoSize
          gh release view $tag --repo $repo --json url,assets
