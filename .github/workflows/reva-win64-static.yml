# RevA Windows static release pipeline v3: UCRT64 + real GUI launch gate
name: Build and publish FRLG RevA static Windows x64

on:
  push:
    branches:
      - revA-bootstrap
    paths:
      - .github/workflows/reva-win64-static.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reva-win64-static-ucrt64
  cancel-in-progress: true

env:
  RELEASE_TAG: revA-20260930
  EXPECTED_REVA: fadbf93a565a5bd0b3e7f12b848fc208064a94f1

jobs:
  build-release:
    runs-on: windows-2022
    steps:
      - name: Checkout exact RevA source
        uses: actions/checkout@v4
        with:
          ref: fadbf93a565a5bd0b3e7f12b848fc208064a94f1
          fetch-depth: 0

      - name: Verify RevA source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_REVA) { throw "RevA source mismatch: $actual" }
          git log --oneline --decorate -3

      - name: Set up UCRT64 static toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt5-static
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-openssl

      - name: Configure static UCRT64 distribution build
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/qt5-static/bin:/ucrt64/bin:$PATH"

          QTSTATIC_LIB=/ucrt64/qt5-static/lib
          QTPNG="$QTSTATIC_LIB/libqtlibpng.a"
          ZLIB_STATIC=/ucrt64/lib/libz.a
          SDL2_STATIC=/ucrt64/lib/libSDL2.a
          SDL2MAIN_STATIC=/ucrt64/lib/libSDL2main.a
          EPOXY_STATIC=/ucrt64/lib/libepoxy.a

          for lib in "$QTPNG" "$ZLIB_STATIC" "$SDL2_STATIC" "$SDL2MAIN_STATIC" "$EPOXY_STATIC"; do
            test -f "$lib" || { echo "Required static library missing: $lib" >&2; exit 1; }
            ls -lh "$lib"
          done

          HIDDEN=/ucrt64/lib/.reva-hidden-import-libs
          mkdir -p "$HIDDEN"
          for name in png16 ssl crypto zstd z SDL2 epoxy; do
            imp="/ucrt64/lib/lib${name}.dll.a"
            if [[ -f "$imp" ]]; then
              echo "Hiding DLL import library: $imp"
              mv "$imp" "$HIDDEN/"
            fi
          done

          cmake -S . -B build-static -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/ucrt64/qt5-static \
            -DQt5_DIR=/ucrt64/qt5-static/lib/cmake/Qt5 \
            -DFORCE_QT_VERSION=5 \
            -DCMAKE_EXE_LINKER_FLAGS='-static -static-libgcc -static-libstdc++' \
            -DDISTBUILD=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DBUILD_LTO=ON \
            -DBUILD_QT=ON \
            -DBUILD_SDL=ON \
            -DBUILD_GL=ON \
            -DBUILD_GLES2=OFF \
            -DBUILD_GLES3=OFF \
            -DUSE_EPOXY=ON \
            -DEPOXY_LIBRARIES="$EPOXY_STATIC" \
            -DEPOXY_INCLUDE_DIRS=/ucrt64/include \
            -DUSE_ZLIB=ON \
            -DZLIB_LIBRARY="$ZLIB_STATIC" \
            -DZLIB_LIBRARY_RELEASE="$ZLIB_STATIC" \
            -DZLIB_INCLUDE_DIR=/ucrt64/include \
            -DUSE_PNG=ON \
            -DPNG_LIBRARY="$QTPNG" \
            -DPNG_LIBRARY_RELEASE="$QTPNG" \
            -DPNG_PNG_INCLUDE_DIR=/ucrt64/include \
            -DSDL2_LIBRARIES_TEMP="$SDL2_STATIC" \
            -DSDL2MAIN_LIBRARY="$SDL2MAIN_STATIC" \
            -DUSE_MINIZIP=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_LIBZIP=OFF \
            -DUSE_LZMA=OFF \
            -DUSE_ELF=OFF \
            -DUSE_LUA=OFF \
            -DUSE_SQLITE3=OFF \
            -DUSE_JSON_C=OFF \
            -DUSE_DISCORD_RPC=OFF

      - name: Build static Windows targets
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/qt5-static/bin:/ucrt64/bin:$PATH"
          cmake --build build-static --target mgba-qt mgba-sdl --parallel 2
          test -f build-static/mGBA.exe
          test -f build-static/mgba-sdl.exe
          ls -lh build-static/mGBA.exe build-static/mgba-sdl.exe

      - name: Audit executable imports
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bad=0
          for exe in build-static/mGBA.exe build-static/mgba-sdl.exe; do
            echo "==== $exe imports ===="
            imports=$(objdump -p "$exe" | awk '/DLL Name:/ {print $3}')
            printf '%s\n' "$imports"
            if printf '%s\n' "$imports" | grep -Eqi '(^|/)(Qt[56]|SDL2|libepoxy|libpng|zlib|zlib1|libzstd|libgcc|libstdc\+\+|libwinpthread|libcrypto|libssl).*\.dll$'; then
              echo "Unexpected non-system runtime dependency in $exe"
              bad=1
            fi
          done
          test "$bad" -eq 0

      - name: Assemble portable directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'portable-static'
          Remove-Item $portable -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portable | Out-Null

          Copy-Item 'build-static\mGBA.exe' (Join-Path $portable 'mGBA.exe')
          Copy-Item 'build-static\mgba-sdl.exe' (Join-Path $portable 'mgba-sdl.exe')
          Copy-Item 'LICENSE' (Join-Path $portable 'LICENSE.txt')
          Copy-Item 'CHANGES' (Join-Path $portable 'CHANGES.txt')
          Copy-Item 'res\nointro.dat' (Join-Path $portable 'nointro.dat')
          New-Item -ItemType File -Path (Join-Path $portable 'portable.ini') -Force | Out-Null
          if (Test-Path 'res\shaders') { Copy-Item 'res\shaders' (Join-Path $portable 'shaders') -Recurse }
          if (Test-Path 'res\scripts') { Copy-Item 'res\scripts' (Join-Path $portable 'scripts') -Recurse }

          $dlls = Get-ChildItem $portable -Recurse -Filter '*.dll' -File
          if ($dlls) { throw 'Static package unexpectedly contains DLL files' }

      - name: Real-launch test static GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'portable-static'
          $exe = Join-Path $portable 'mGBA.exe'
          $oldPath = $env:PATH
          $p = $null
          try {
            $env:PATH = "$portable;$env:WINDIR\System32;$env:WINDIR"
            $p = Start-Process -FilePath $exe -WorkingDirectory $portable -PassThru
            Start-Sleep -Seconds 10
            $p.Refresh()
            if ($p.HasExited) { throw "mGBA GUI exited early with code $($p.ExitCode)" }
            if ($p.MainWindowHandle -eq 0) { Write-Host 'Process alive; GUI handle not yet exposed by runner.' }
            Write-Host "GUI launch gate passed. PID=$($p.Id)"
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            $env:PATH = $oldPath
          }

          $sdl = Join-Path $portable 'mgba-sdl.exe'
          $sdlp = Start-Process -FilePath $sdl -ArgumentList '--version' -WorkingDirectory $portable -Wait -PassThru
          if ($sdlp.ExitCode -ne 0) { throw "mgba-sdl.exe --version exited $($sdlp.ExitCode)" }

      - name: Create verified 7z package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $PWD 'mGBA-FRLG-RevA-win64.7z'
          Remove-Item $asset -Force -ErrorAction SilentlyContinue
          & 7z a -t7z -mx=9 -m0=lzma2:d=64m:fb=273 -ms=on -mmt=on $asset '.\portable-static\*'
          if ($LASTEXITCODE -ne 0) { throw '7z packaging failed' }
          $hash = Get-FileHash $asset -Algorithm SHA256
          Get-Item $asset | Select-Object Name,Length | Format-Table -AutoSize
          $hash | Format-Table -AutoSize

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-FRLG-RevA-win64-ucrt64
          path: mGBA-FRLG-RevA-win64.7z
          if-no-files-found: error

      - name: Publish Windows package to RevA release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '969981/mgba'
          $tag = $env:RELEASE_TAG
          $asset = '.\mGBA-FRLG-RevA-win64.7z'
          $tagSha = (gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha').Trim()
          if ($tagSha -ne $env:EXPECTED_REVA) { throw "Tag $tag points to $tagSha, expected $env:EXPECTED_REVA" }
          gh release upload $tag $asset --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --repo $repo --notes 'FRLG RevA multi-platform release. Windows x64 is built with UCRT64 + static Qt 5 and is only published after static-runtime import auditing plus a real no-argument GUI launch test. Includes the SWI 0x48 FireRed/LeafGreen RevA save fix.'
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed' }
          gh release view $tag --repo $repo --json url,assets
