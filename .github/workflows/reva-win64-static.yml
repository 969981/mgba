name: Build FRLG RevA official-style static Windows x64

on:
  push:
    branches:
      - revA-bootstrap
    paths:
      - .github/workflows/reva-win64-static.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reva-win64-static-mingw
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-2022
    steps:
      - name: Checkout exact RevA source
        uses: actions/checkout@v4
        with:
          ref: revA
          fetch-depth: 0

      - name: Verify RevA source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'fadbf93a565a5bd0b3e7f12b848fc208064a94f1'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "revA moved: $actual, expected $expected" }
          git log --oneline --decorate -3

      - name: Set up MSYS2 MinGW64 static toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-static
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl

      - name: Configure static MinGW64 distribution build
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/mingw64/qt5-static/bin:/mingw64/bin:$PATH"

          QTSTATIC_LIB=/mingw64/qt5-static/lib
          QTPNG="$QTSTATIC_LIB/libqtlibpng.a"
          QTZLIB="$QTSTATIC_LIB/libqtzlib.a"
          SDL2_STATIC=/mingw64/lib/libSDL2.a
          SDL2MAIN_STATIC=/mingw64/lib/libSDL2main.a
          EPOXY_STATIC=/mingw64/lib/libepoxy.a

          echo 'Static libraries selected:'
          for lib in "$QTPNG" "$QTZLIB" "$SDL2_STATIC" "$SDL2MAIN_STATIC" "$EPOXY_STATIC"; do
            if [[ ! -f "$lib" ]]; then
              echo "Required static library missing: $lib" >&2
              ls -la "$(dirname "$lib")" | head -100 || true
              exit 1
            fi
            ls -lh "$lib"
          done

          # Qt5-static already embeds its own libpng/zlib. Reuse those exact
          # archives for mGBA too, instead of mixing Qt's libqtlibpng with the
          # system libpng DLL import library (which causes duplicate png_* symbols).
          # Force SDL2 and epoxy to their real static archives as well.
          cmake -S . -B build-static -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64/qt5-static \
            -DQt5_DIR=/mingw64/qt5-static/lib/cmake/Qt5 \
            -DFORCE_QT_VERSION=5 \
            -DCMAKE_EXE_LINKER_FLAGS='-static -static-libgcc -static-libstdc++' \
            -DDISTBUILD=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DBUILD_LTO=ON \
            -DBUILD_QT=ON \
            -DBUILD_SDL=ON \
            -DBUILD_GL=ON \
            -DBUILD_GLES2=OFF \
            -DBUILD_GLES3=OFF \
            -DUSE_EPOXY=ON \
            -DEPOXY_LIBRARIES="$EPOXY_STATIC" \
            -DEPOXY_INCLUDE_DIRS=/mingw64/include \
            -DUSE_ZLIB=ON \
            -DZLIB_LIBRARY="$QTZLIB" \
            -DZLIB_LIBRARY_RELEASE="$QTZLIB" \
            -DZLIB_INCLUDE_DIR=/mingw64/include \
            -DUSE_PNG=ON \
            -DPNG_LIBRARY="$QTPNG" \
            -DPNG_LIBRARY_RELEASE="$QTPNG" \
            -DPNG_PNG_INCLUDE_DIR=/mingw64/include \
            -DSDL2_LIBRARIES_TEMP="$SDL2_STATIC" \
            -DSDL2MAIN_LIBRARY="$SDL2MAIN_STATIC" \
            -DUSE_MINIZIP=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_LIBZIP=OFF \
            -DUSE_LZMA=OFF \
            -DUSE_ELF=OFF \
            -DUSE_LUA=OFF \
            -DUSE_SQLITE3=OFF \
            -DUSE_JSON_C=OFF \
            -DUSE_DISCORD_RPC=OFF

          echo '==== selected dependency cache entries ===='
          grep -Ei '^(PNG_|ZLIB_|SDL2|EPOXY_).*=' build-static/CMakeCache.txt || true
          if grep -Ei '^(PNG_|ZLIB_|SDL2|EPOXY_).*=[^;]*\.dll\.a' build-static/CMakeCache.txt; then
            echo 'A dependency resolved to a DLL import library; refusing non-static build.' >&2
            exit 1
          fi

      - name: Build static Windows targets
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/mingw64/qt5-static/bin:/mingw64/bin:$PATH"
          cmake --build build-static --target mgba-qt mgba-sdl --parallel 2
          test -f build-static/mGBA.exe
          test -f build-static/mgba-sdl.exe
          ls -lh build-static/mGBA.exe build-static/mgba-sdl.exe

      - name: Audit executable imports
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bad=0
          for exe in build-static/mGBA.exe build-static/mgba-sdl.exe; do
            echo "==== $exe imports ===="
            imports=$(objdump -p "$exe" | awk '/DLL Name:/ {print $3}')
            printf '%s\n' "$imports"
            if printf '%s\n' "$imports" | grep -Eqi '(^|/)(Qt[56]|SDL2|libepoxy|libpng|zlib|zlib1|libgcc|libstdc\+\+|libwinpthread|libcrypto|libssl).*\.dll$'; then
              echo "Unexpected non-system runtime dependency in $exe"
              bad=1
            fi
          done
          test "$bad" -eq 0

      - name: Assemble official-style portable directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'portable-static'
          Remove-Item $portable -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portable | Out-Null

          Copy-Item 'build-static\mGBA.exe' (Join-Path $portable 'mGBA.exe')
          Copy-Item 'build-static\mgba-sdl.exe' (Join-Path $portable 'mgba-sdl.exe')
          Copy-Item 'LICENSE' (Join-Path $portable 'LICENSE.txt')
          Copy-Item 'CHANGES' (Join-Path $portable 'CHANGES.txt')
          Copy-Item 'res\nointro.dat' (Join-Path $portable 'nointro.dat')
          New-Item -ItemType File -Path (Join-Path $portable 'portable.ini') -Force | Out-Null

          if (Test-Path 'res\shaders') {
            Copy-Item 'res\shaders' (Join-Path $portable 'shaders') -Recurse
          }
          if (Test-Path 'res\scripts') {
            Copy-Item 'res\scripts' (Join-Path $portable 'scripts') -Recurse
          }

          $dlls = Get-ChildItem $portable -Recurse -Filter '*.dll' -File
          if ($dlls) {
            $dlls | Select-Object FullName,Length | Format-Table -AutoSize
            throw 'Static package unexpectedly contains DLL files'
          }

          Write-Host 'Official-style static package contents:'
          Get-ChildItem $portable -Recurse | Select-Object FullName,Length | Format-Table -AutoSize
          $bytes = (Get-ChildItem $portable -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("Portable uncompressed: {0:N2} MiB" -f ($bytes / 1MB))

      - name: Real-launch test static GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'portable-static'
          $exe = Join-Path $portable 'mGBA.exe'
          $stdout = Join-Path $PWD 'mgba-gui.stdout.txt'
          $stderr = Join-Path $PWD 'mgba-gui.stderr.txt'
          $oldPath = $env:PATH
          try {
            # Deliberately exclude MSYS2/Qt/developer directories. This is a real
            # no-argument GUI launch, not --version (which exits before Qt starts).
            $env:PATH = "$portable;C:\Windows\System32;C:\Windows"
            $env:QT_DEBUG_PLUGINS = '1'
            $p = Start-Process -FilePath $exe -WorkingDirectory $portable -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Start-Sleep -Seconds 8
            $p.Refresh()
            if ($p.HasExited) {
              Write-Host "mGBA GUI exited early with code $($p.ExitCode)"
              if (Test-Path $stdout) { Get-Content $stdout -ErrorAction SilentlyContinue }
              if (Test-Path $stderr) { Get-Content $stderr -ErrorAction SilentlyContinue }
              throw 'mGBA GUI failed real launch test'
            }
            Write-Host "mGBA GUI stayed alive. PID=$($p.Id) MainWindowHandle=$($p.MainWindowHandle)"
            if ($p.MainWindowHandle -eq 0) {
              Write-Warning 'Process is alive but runner did not expose a main window handle; keeping lifecycle gate as the portable-runtime test.'
            }
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            $env:PATH = $oldPath
            Remove-Item Env:QT_DEBUG_PLUGINS -ErrorAction SilentlyContinue
          }

          # SDL CLI path should also execute from the same isolated package.
          $sdl = Join-Path $portable 'mgba-sdl.exe'
          $sdlp = Start-Process -FilePath $sdl -ArgumentList '--version' -WorkingDirectory $portable -Wait -PassThru
          if ($sdlp.ExitCode -ne 0) { throw "mgba-sdl.exe --version exited $($sdlp.ExitCode)" }

      - name: Create solid 7z package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $PWD 'mGBA-FRLG-RevA-win64.7z'
          Remove-Item $asset -Force -ErrorAction SilentlyContinue
          & 7z a -t7z -mx=9 -m0=lzma2:d=64m:fb=273 -ms=on -mmt=on $asset '.\portable-static\*'
          if ($LASTEXITCODE -ne 0) { throw '7z packaging failed' }
          $item = Get-Item $asset
          $hash = Get-FileHash $asset -Algorithm SHA256
          Write-Host ("7z size: {0:N2} MiB" -f ($item.Length / 1MB))
          $item | Select-Object Name,Length | Format-Table -AutoSize
          $hash | Format-Table -AutoSize

      - name: Upload verified static artifact
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-FRLG-RevA-win64-static
          path: mGBA-FRLG-RevA-win64.7z
          if-no-files-found: error

      - name: Publish static package to RevA release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '969981/mgba'
          $tag = 'revA-20260930'
          $expected = 'fadbf93a565a5bd0b3e7f12b848fc208064a94f1'
          $asset = '.\mGBA-FRLG-RevA-win64.7z'
          $tagSha = (gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha').Trim()
          if ($tagSha -ne $expected) { throw "Tag $tag points to $tagSha, expected $expected" }
          gh release upload $tag $asset --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --repo $repo --notes 'FRLG RevA multi-platform release. Windows x64 uses an official-style static MinGW64 + Qt 5 build. Qt, SDL2, libepoxy, PNG/zlib and compiler runtimes are linked into the executables instead of shipped as loose runtime DLLs. The Windows package is only published after a real no-argument GUI launch test in an isolated PATH; --version alone is not accepted as a GUI/runtime test. Includes the SWI 0x48 FireRed/LeafGreen RevA save fix.'
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed' }
          gh release view $tag --repo $repo --json url,assets
