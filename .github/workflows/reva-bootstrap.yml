name: Build and release FRLG RevA portable Windows x64

on:
  push:
    branches:
      - revA-bootstrap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout exact RevA source
        uses: actions/checkout@v4
        with:
          ref: revA
          fetch-depth: 0

      - name: Verify RevA source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'fadbf93a565a5bd0b3e7f12b848fc208064a94f1'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "revA moved: $actual, expected $expected" }
          git log --oneline --decorate -3

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            unzip
            p7zip
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gdb
            mingw-w64-x86_64-libelf
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-ntldd-git

      - name: Configure release build
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cmake -S . -B build-release -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISTBUILD=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF

      - name: Build mGBA
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cmake --build build-release --parallel 2
          find build-release -type f \( -iname 'mGBA.exe' -o -iname 'mgba-sdl.exe' \) -print

      - name: Create base package
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd build-release
          cpack -G ZIP
          ls -lah *.zip

      - name: Assemble compact portable directory using upstream deploy logic
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          rm -rf cpack-extracted portable
          mkdir -p cpack-extracted portable

          BASE_ZIP=$(find build-release -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$BASE_ZIP"
          unzip -q "$BASE_ZIP" -d cpack-extracted

          TOP_COUNT=$(find cpack-extracted -mindepth 1 -maxdepth 1 | wc -l)
          ROOT=$(find cpack-extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ "$TOP_COUNT" -eq 1 ] && [ -n "$ROOT" ]; then
            cp -a "$ROOT"/. portable/
          else
            cp -a cpack-extracted/. portable/
          fi

          rm -rf portable/include portable/lib portable/share/man
          rm -f portable/libmgba.a portable/libmgba.dll portable/libmgba.dll.a
          test -f portable/mGBA.exe
          test -f portable/mgba-sdl.exe
          test ! -f portable/libmgba.dll

          # Match upstream mGBA packaging: ntldd -R only the shipped executables,
          # then let windeployqt add the minimal Qt runtime/plugins.
          ./tools/deploy-win.sh "$PWD/portable/mGBA.exe" "$PWD/portable" "$PWD"
          ./tools/deploy-win.sh "$PWD/portable/mgba-sdl.exe" "$PWD/portable" "$PWD"

          # Strip symbols where possible; ignore files that are not PE binaries.
          find portable -maxdepth 1 -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 | \
            xargs -0 -r -n1 sh -c 'strip --strip-unneeded "$1" 2>/dev/null || true' _

          test -f portable/Qt5Core.dll
          test -f portable/libstdc++-6.dll
          test -f portable/SDL2.dll
          test -f portable/platforms/qwindows.dll
          test ! -f portable/libmgba.dll

          echo "Portable files: $(find portable -type f | wc -l)"
          echo "Portable DLLs: $(find portable -type f -iname '*.dll' | wc -l)"
          du -sh portable
          find portable -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Smoke-test compact package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'portable'
          foreach ($required in @('mGBA.exe','mgba-sdl.exe','Qt5Core.dll','libstdc++-6.dll','SDL2.dll','platforms\qwindows.dll')) {
            if (-not (Test-Path (Join-Path $portable $required))) { throw "$required missing" }
          }
          if (Test-Path (Join-Path $portable 'libmgba.dll')) { throw 'libmgba.dll unexpectedly present; core is not static' }

          function Test-PortableExe([string]$exeName) {
            $exe = Join-Path $portable $exeName
            Write-Host "Testing $exeName with isolated PATH..."
            $p = Start-Process -FilePath $exe -ArgumentList '--version' -WorkingDirectory $portable -Wait -PassThru
            Write-Host "$exeName exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "$exeName --version failed with $($p.ExitCode)" }
          }

          $oldPath = $env:PATH
          try {
            $env:PATH = "$portable;C:\Windows\System32;C:\Windows"
            Test-PortableExe 'mgba-sdl.exe'
            Test-PortableExe 'mGBA.exe'
          } finally {
            $env:PATH = $oldPath
          }

      - name: Create compact ZIP and official-style 7z
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD 'mGBA-FRLG-RevA-Windows-x64.zip'
          $seven = Join-Path $PWD 'mGBA-FRLG-RevA-win64.7z'
          Remove-Item $zip,$seven -Force -ErrorAction SilentlyContinue

          Compress-Archive -Path '.\portable\*' -DestinationPath $zip -CompressionLevel Optimal
          & 7z a -t7z -mx=9 -ms=on $seven '.\portable\*'
          if ($LASTEXITCODE -ne 0) { throw '7z packaging failed' }

          Get-Item $zip,$seven | Select-Object Name,Length | Format-Table -AutoSize
          Get-FileHash $zip,$seven -Algorithm SHA256 | Format-Table -AutoSize

      - name: Upload compact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-FRLG-RevA-Windows-x64-portable
          path: |
            mGBA-FRLG-RevA-Windows-x64.zip
            mGBA-FRLG-RevA-win64.7z
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '969981/mgba'
          $tag = 'revA-20260930'
          $expected = 'fadbf93a565a5bd0b3e7f12b848fc208064a94f1'
          $assets = @(
            '.\mGBA-FRLG-RevA-Windows-x64.zip',
            '.\mGBA-FRLG-RevA-win64.7z'
          )
          $title = 'mGBA FRLG RevA (2026-09-30)'
          $notes = @'
FRLG RevA build based on 969981/mgba master c3c8e5e with the RevA commits rebased on top as c809ee643 and fadbf93a5.

Windows x64 packaging now follows upstream mGBA's deploy strategy: only runtime DLLs reachable from the shipped executables are collected with ntldd -R, then windeployqt adds the required Qt runtime/plugins. The core is linked statically and symbols are stripped. Both ZIP and official-style solid 7z packages are provided.

Includes the SWI 0x48 FireRed/LeafGreen RevA save fix.
'@

          $tagSha = gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0) {
            $tagSha = $tagSha.Trim()
            if ($tagSha -ne $expected) { throw "Tag $tag points to $tagSha, expected $expected" }
          } else {
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$expected" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to create tag $tag at $expected" }
          }

          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            foreach ($asset in $assets) {
              gh release upload $tag $asset --repo $repo --clobber
              if ($LASTEXITCODE -ne 0) { throw "Failed to upload $asset" }
            }
            gh release edit $tag --repo $repo --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update release metadata' }
          } else {
            gh release create $tag @assets --repo $repo --verify-tag --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release' }
          }

          gh release view $tag --repo $repo --json url,tagName,targetCommitish,assets
