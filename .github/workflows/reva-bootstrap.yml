name: Build and release FRLG RevA portable Windows x64

on:
  push:
    branches:
      - revA-bootstrap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout exact RevA source
        uses: actions/checkout@v4
        with:
          ref: revA
          fetch-depth: 0

      - name: Verify RevA source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'fadbf93a565a5bd0b3e7f12b848fc208064a94f1'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "revA moved: $actual, expected $expected" }
          git log --oneline --decorate -3

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            unzip
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gdb
            mingw-w64-x86_64-libelf
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-ntldd-git

      - name: Configure static-core release build
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cmake -S . -B build-static -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF

      - name: Build mGBA
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cmake --build build-static --parallel 2
          find build-static -type f \( -iname 'mGBA.exe' -o -iname 'mgba-sdl.exe' \) -print

      - name: Smoke-test static-core build in MSYS2
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          QT_EXE=$(find build-static -type f -iname 'mGBA.exe' | head -n 1)
          SDL_EXE=$(find build-static -type f -iname 'mgba-sdl.exe' | head -n 1)
          test -n "$QT_EXE"
          test -n "$SDL_EXE"
          "$QT_EXE" --version
          "$SDL_EXE" --version

      - name: Create base CPack ZIP
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd build-static
          cpack -G ZIP
          ls -lah *.zip

      - name: Assemble portable Windows x64 directory
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          rm -rf cpack-extracted portable
          mkdir -p cpack-extracted portable

          BASE_ZIP=$(find build-static -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$BASE_ZIP"
          unzip -q "$BASE_ZIP" -d cpack-extracted

          TOP_COUNT=$(find cpack-extracted -mindepth 1 -maxdepth 1 | wc -l)
          ROOT=$(find cpack-extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ "$TOP_COUNT" -eq 1 ] && [ -n "$ROOT" ]; then
            cp -a "$ROOT"/. portable/
          else
            cp -a cpack-extracted/. portable/
          fi

          rm -rf portable/include
          rm -f portable/libmgba.a portable/libmgba.dll portable/libmgba.dll.a
          test -f portable/mGBA.exe
          test -f portable/mgba-sdl.exe
          test ! -f portable/libmgba.dll

          WINDEPLOYQT=$(command -v windeployqt-qt5 || command -v windeployqt || true)
          test -n "$WINDEPLOYQT"
          "$WINDEPLOYQT" --no-opengl-sw --no-svg --release \
            --dir "$PWD/portable" "$PWD/portable/mGBA.exe"

          declare -A mingw_dll
          while IFS= read -r p; do
            name=$(basename "$p")
            key=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
            mingw_dll["$key"]="$p"
          done < <(find /mingw64/bin -maxdepth 1 -type f -iname '*.dll' -print)

          declare -A present
          while IFS= read -r p; do
            name=$(basename "$p")
            key=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
            present["$key"]=1
          done < <(find portable -type f -iname '*.dll' -print)

          mapfile -t queue < <(find portable -type f \( -iname '*.exe' -o -iname '*.dll' \) -print)
          declare -A scanned
          idx=0
          while [ "$idx" -lt "${#queue[@]}" ]; do
            bin="${queue[$idx]}"
            idx=$((idx + 1))

            if [[ -n "${scanned[$bin]+x}" ]]; then
              continue
            fi
            scanned["$bin"]=1

            while IFS= read -r dep; do
              dep=$(printf '%s' "$dep" | tr -d '\r')
              [ -n "$dep" ] || continue
              key=$(printf '%s' "$dep" | tr '[:upper:]' '[:lower:]')

              if [[ -n "${present[$key]+x}" ]]; then
                continue
              fi

              src="${mingw_dll[$key]-}"
              if [ -n "$src" ]; then
                dst="portable/$(basename "$src")"
                echo "Bundling $dep from $src"
                cp -f "$src" "$dst"
                present["$key"]=1
                queue+=("$dst")
              fi
            done < <(objdump -p "$bin" 2>/dev/null | awk '/DLL Name:/ {print $3}')
          done

          test -f portable/Qt5Core.dll
          test -f portable/libstdc++-6.dll
          test -f portable/SDL2.dll
          test -f portable/platforms/qwindows.dll
          test ! -f portable/libmgba.dll

          echo "Portable files: $(find portable -type f | wc -l)"
          echo "Portable DLLs: $(find portable -type f -iname '*.dll' | wc -l)"
          echo "Runtime DLL collection completed; isolated Windows smoke test is authoritative."

      - name: Smoke-test portable package and create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'portable'
          foreach ($required in @('mGBA.exe','mgba-sdl.exe','Qt5Core.dll','libstdc++-6.dll','SDL2.dll','platforms\qwindows.dll')) {
            if (-not (Test-Path (Join-Path $portable $required))) { throw "$required missing" }
          }
          if (Test-Path (Join-Path $portable 'libmgba.dll')) { throw 'libmgba.dll unexpectedly present; core is not static' }

          function Test-PortableExe([string]$exeName) {
            $exe = Join-Path $portable $exeName
            Write-Host "Testing $exeName with isolated PATH..."
            try {
              $p = Start-Process -FilePath $exe -ArgumentList '--version' -WorkingDirectory $portable -Wait -PassThru
            } catch {
              throw "$exeName failed to start: $($_.Exception.Message)"
            }
            Write-Host "$exeName exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "$exeName --version failed with $($p.ExitCode)" }
          }

          $oldPath = $env:PATH
          try {
            $env:PATH = "$portable;C:\Windows\System32;C:\Windows"
            Test-PortableExe 'mgba-sdl.exe'
            Test-PortableExe 'mGBA.exe'
          } finally {
            $env:PATH = $oldPath
          }

          $zip = Join-Path $PWD 'mGBA-FRLG-RevA-Windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$portable\*" -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name,Length
          Get-FileHash $zip -Algorithm SHA256

      - name: Upload final portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-FRLG-RevA-Windows-x64-portable
          path: mGBA-FRLG-RevA-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '969981/mgba'
          $tag = 'revA-20260930'
          $expected = 'fadbf93a565a5bd0b3e7f12b848fc208064a94f1'
          $asset = '.\mGBA-FRLG-RevA-Windows-x64.zip'
          $title = 'mGBA FRLG RevA (2026-09-30)'
          $notes = 'Windows x64 portable build based on 969981/mgba master c3c8e5e, with Aryan10/mgba-frlg-revA commits 0102d3e and 9fd5602 rebased on top as c809ee643 and fadbf93a5. The mGBA core is linked statically for Windows distribution stability; Qt/SDL runtime dependencies are bundled. Includes the SWI 0x48 FireRed/LeafGreen RevA save fix.'

          $tagSha = gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0) {
            $tagSha = $tagSha.Trim()
            if ($tagSha -ne $expected) {
              throw "Tag $tag points to $tagSha, expected $expected"
            }
          } else {
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$expected" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to create tag $tag at $expected" }
          }

          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload release asset" }
            gh release edit $tag --repo $repo --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release metadata" }
          } else {
            gh release create $tag $asset --repo $repo --verify-tag --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release" }
          }

          gh release view $tag --repo $repo --json url,tagName,targetCommitish,assets
