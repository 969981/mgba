name: Build and release FRLG RevA official-style Windows x64

on:
  push:
    branches:
      - revA-bootstrap
    paths:
      - .github/workflows/reva-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reva-win64-msvc
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-2022
    steps:
      - name: Checkout exact RevA source
        uses: actions/checkout@v4
        with:
          ref: revA
          fetch-depth: 0

      - name: Verify RevA source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'fadbf93a565a5bd0b3e7f12b848fc208064a94f1'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "revA moved: $actual, expected $expected" }
          git log --oneline --decorate -3

      - name: Install Qt 5 MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare vcpkg release dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw "vcpkg not found at $vcpkg" }
          & $vcpkg install libepoxy sdl2 libpng --triplet x64-windows-release --recurse
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg dependency install failed' }

      - name: Configure MSVC distribution build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts\buildsystems\vcpkg.cmake'
          $runtimeOut = (Join-Path $PWD 'build-release\runtime').Replace('\','/')
          cmake -S . -B build-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DDISTBUILD=ON `
            -DBUILD_STATIC=ON `
            -DBUILD_SHARED=OFF `
            -DBUILD_LTO=ON `
            -DUSE_FFMPEG=OFF `
            -DUSE_LIBZIP=OFF `
            -DUSE_LZMA=OFF `
            -DUSE_ELF=OFF `
            -DUSE_LUA=OFF `
            -DUSE_SQLITE3=OFF `
            -DUSE_JSON_C=OFF `
            -DUSE_DISCORD_RPC=OFF `
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$runtimeOut"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          Get-ChildItem build-release -Recurse -Filter *.exe | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Assemble minimal portable directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'portable'
          Remove-Item $portable -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portable | Out-Null

          $qtExe = Get-ChildItem build-release -Recurse -Filter 'mGBA.exe' | Where-Object { $_.FullName -notmatch '_CPack_Packages' } | Select-Object -First 1
          $sdlExe = Get-ChildItem build-release -Recurse -Filter 'mgba-sdl.exe' | Where-Object { $_.FullName -notmatch '_CPack_Packages' } | Select-Object -First 1
          if (-not $qtExe) { throw 'mGBA.exe not found' }
          if (-not $sdlExe) { throw 'mgba-sdl.exe not found' }
          Copy-Item $qtExe.FullName (Join-Path $portable 'mGBA.exe')
          Copy-Item $sdlExe.FullName (Join-Path $portable 'mgba-sdl.exe')

          foreach ($doc in @('LICENSE','CHANGES')) {
            if (Test-Path $doc) { Copy-Item $doc (Join-Path $portable ($doc + '.txt')) }
          }

          $windeployqt = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          & $windeployqt --release --compiler-runtime --no-translations --no-opengl-sw --no-system-d3d-compiler --no-svg $portable\mGBA.exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }

          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows-release\bin'
          if (-not (Test-Path $vcpkgBin)) { throw "vcpkg bin not found: $vcpkgBin" }

          function Get-Dependents([string]$binary) {
            $lines = & dumpbin.exe /dependents $binary 2>$null
            foreach ($line in $lines) {
              if ($line -match '^\s+([^\s]+\.dll)\s*$') { $matches[1] }
            }
          }

          $systemDlls = @(
            'KERNEL32.dll','USER32.dll','GDI32.dll','ADVAPI32.dll','SHELL32.dll','OLE32.dll','OLEAUT32.dll',
            'COMDLG32.dll','COMCTL32.dll','WS2_32.dll','WINMM.dll','IMM32.dll','VERSION.dll','SHLWAPI.dll',
            'DWMAPI.dll','UXTHEME.dll','SETUPAPI.dll','CRYPT32.dll','SECUR32.dll','RPCRT4.dll','IPHLPAPI.dll',
            'DNSAPI.dll','WINHTTP.dll','WTSAPI32.dll','POWRPROF.dll','USERENV.dll','MSVCRT.dll','NTDLL.dll'
          ) | ForEach-Object { $_.ToLowerInvariant() }

          $queue = [System.Collections.Generic.Queue[string]]::new()
          Get-ChildItem $portable -Recurse -File | Where-Object { $_.Extension -in '.exe','.dll' } | ForEach-Object { $queue.Enqueue($_.FullName) }
          $scanned = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)

          while ($queue.Count -gt 0) {
            $binary = $queue.Dequeue()
            if (-not $scanned.Add($binary)) { continue }
            foreach ($dep in (Get-Dependents $binary)) {
              $lower = $dep.ToLowerInvariant()
              if ($systemDlls -contains $lower -or $lower -match '^api-ms-win-' -or $lower -match '^ext-ms-') { continue }
              if (Get-ChildItem $portable -Recurse -Filter $dep -ErrorAction SilentlyContinue | Select-Object -First 1) { continue }
              $src = Join-Path $vcpkgBin $dep
              if (Test-Path $src) {
                $dst = Join-Path $portable $dep
                Copy-Item $src $dst
                $queue.Enqueue($dst)
                Write-Host "Bundled vcpkg runtime: $dep"
              }
            }
          }

          if (Test-Path (Join-Path $portable 'libmgba.dll')) { throw 'libmgba.dll unexpectedly present' }
          if (-not (Test-Path (Join-Path $portable 'platforms\qwindows.dll'))) { throw 'Qt platform plugin missing' }

          Write-Host 'Packaged files:'
          Get-ChildItem $portable -Recurse -File | Sort-Object Length -Descending | Select-Object Length,FullName | Format-Table -AutoSize
          $bytes = (Get-ChildItem $portable -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("Portable uncompressed: {0:N2} MiB" -f ($bytes / 1MB))

      - name: Smoke-test isolated package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'portable'
          function Test-Exe([string]$name) {
            $exe = Join-Path $portable $name
            if (-not (Test-Path $exe)) { throw "$name missing" }
            $oldPath = $env:PATH
            try {
              $env:PATH = "$portable;C:\Windows\System32;C:\Windows"
              $p = Start-Process -FilePath $exe -ArgumentList '--version' -WorkingDirectory $portable -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw "$name --version exited $($p.ExitCode)" }
            } finally {
              $env:PATH = $oldPath
            }
          }
          Test-Exe 'mgba-sdl.exe'
          Test-Exe 'mGBA.exe'

      - name: Create official-style 7z package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $PWD 'mGBA-FRLG-RevA-win64.7z'
          Remove-Item $asset -Force -ErrorAction SilentlyContinue
          & 7z a -t7z -mx=9 -m0=lzma2 -ms=on $asset '.\portable\*'
          if ($LASTEXITCODE -ne 0) { throw '7z packaging failed' }
          $item = Get-Item $asset
          $hash = Get-FileHash $asset -Algorithm SHA256
          Write-Host ("7z size: {0:N2} MiB" -f ($item.Length / 1MB))
          $item | Select-Object Name,Length | Format-Table -AutoSize
          $hash | Format-Table -AutoSize

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-FRLG-RevA-win64-msvc
          path: mGBA-FRLG-RevA-win64.7z
          if-no-files-found: error

      - name: Publish compact GitHub release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '969981/mgba'
          $tag = 'revA-20260930'
          $expected = 'fadbf93a565a5bd0b3e7f12b848fc208064a94f1'
          $asset = '.\mGBA-FRLG-RevA-win64.7z'
          $tagSha = (gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha').Trim()
          if ($tagSha -ne $expected) { throw "Tag $tag points to $tagSha, expected $expected" }
          gh release upload $tag $asset --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --repo $repo --notes 'FRLG RevA multi-platform release. Windows x64 is packaged with an official-style MSVC + vcpkg + Qt MSVC toolchain instead of an MSYS2/MinGW runtime tree. The mGBA core is static and LTO-enabled; FFmpeg, Lua, SQLite, ELF and other nonessential distribution dependencies are disabled for this build. The Windows release publishes a solid 7z package as the primary asset to keep size and file count close to upstream release practice. Includes the SWI 0x48 FireRed/LeafGreen RevA save fix.'
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed' }
          gh release view $tag --repo $repo --json url,assets
