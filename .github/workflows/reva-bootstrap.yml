name: Finalize FRLG RevA portable release

on:
  push:
    branches:
      - revA-bootstrap

permissions:
  actions: read
  contents: write

jobs:
  finalize-release:
    runs-on: windows-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download successful RevA build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force downloaded | Out-Null
          gh run download 36659361402 --repo 969981/mgba --name mGBA-FRLG-RevA-Windows-x64 --dir downloaded
          Get-ChildItem downloaded

      - name: Set up MSYS2 runtime packaging tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            unzip
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libelf
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-ntldd-git

      - name: Assemble portable Windows x64 directory
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          rm -rf cpack-extracted portable
          mkdir -p cpack-extracted portable
          INNER_ZIP=$(find downloaded -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          test -n "$INNER_ZIP"
          unzip -q "$INNER_ZIP" -d cpack-extracted
          ROOT=$(find cpack-extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$ROOT"
          cp -a "$ROOT"/. portable/
          rm -rf portable/include
          rm -f portable/libmgba.dll.a
          test -f portable/mGBA.exe
          test -f portable/mgba-sdl.exe
          test -f portable/libmgba.dll

          WINDEPLOYQT=/mingw64/bin/windeployqt-qt5.exe
          test -x "$WINDEPLOYQT"
          "$WINDEPLOYQT" --no-opengl-sw --no-svg --release --dir "$PWD/portable" "$PWD/portable/mGBA.exe"

          find portable -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 |
            while IFS= read -r -d '' bin; do ntldd -R "$bin" || true; done |
            grep -i mingw |
            cut -d'>' -f2 |
            sed -e 's/(0x[0-9a-fA-F]\+)//' -e 's/^ \+//' -e 's/ \+$//' -e 's,\\,/,g' |
            sort -u > runtime-dlls.txt

          while IFS= read -r dll; do
            if [ -f "$dll" ]; then
              cp -f "$dll" portable/
            fi
          done < runtime-dlls.txt

          test -f portable/Qt5Core.dll
          test -f portable/libstdc++-6.dll
          test -f portable/SDL2.dll
          test -f portable/platforms/qwindows.dll
          echo "Runtime files: $(find portable -type f | wc -l)"
          echo "DLL files: $(find portable -type f -iname '*.dll' | wc -l)"

      - name: Smoke-test portable binaries and create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $PWD 'portable'
          if (-not (Test-Path "$portable\platforms\qwindows.dll")) { throw 'qwindows.dll missing' }
          if (-not (Test-Path "$portable\Qt5Core.dll")) { throw 'Qt5Core.dll missing' }
          if (-not (Test-Path "$portable\libstdc++-6.dll")) { throw 'libstdc++-6.dll missing' }
          if (-not (Test-Path "$portable\SDL2.dll")) { throw 'SDL2.dll missing' }

          $oldPath = $env:PATH
          $env:PATH = "$portable;C:\Windows\System32;C:\Windows"
          & "$portable\mGBA.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "mGBA.exe --version failed with $LASTEXITCODE" }
          & "$portable\mgba-sdl.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "mgba-sdl.exe --version failed with $LASTEXITCODE" }
          $env:PATH = $oldPath

          $zip = Join-Path $PWD 'mGBA-FRLG-RevA-Windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$portable\*" -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name,Length
          Get-FileHash $zip -Algorithm SHA256

      - name: Upload final portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-FRLG-RevA-Windows-x64-portable
          path: mGBA-FRLG-RevA-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'revA-20260930'
          $expected = 'fadbf93a565a5bd0b3e7f12b848fc208064a94f1'
          $actual = (gh api "repos/969981/mgba/git/ref/tags/$tag" --jq '.object.sha').Trim()
          if ($actual -ne $expected) { throw "Tag $tag points to $actual, expected $expected" }

          gh release view $tag --repo 969981/mgba 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo 969981/mgba --yes
          }

          gh release create $tag '.\mGBA-FRLG-RevA-Windows-x64.zip' --repo 969981/mgba --verify-tag --title 'mGBA FRLG RevA (2026-09-30)' --notes 'Windows x64 portable build based on 969981/mgba master c3c8e5e, with Aryan10/mgba-frlg-revA commits 0102d3e and 9fd5602 rebased on top as c809ee643 and fadbf93a5. Includes the SWI 0x48 FireRed/LeafGreen RevA save fix.'
          gh release view $tag --repo 969981/mgba --json url,tagName,targetCommitish,assets
