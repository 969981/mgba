name: Build FRLG RevA Vita compatibility release

on:
  push:
    branches:
      - revA-bootstrap
    paths:
      - .github/workflows/reva-vita-fix.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  REV_SHA: fadbf93a565a5bd0b3e7f12b848fc208064a94f1
  RELEASE_TAG: revA-20260930

jobs:
  vita:
    name: PlayStation Vita compatibility build
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revA
          fetch-depth: 0
      - name: Verify source
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$REV_SHA"
      - name: Install build tools
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y cmake ninja-build p7zip-full; fi
          if command -v apk >/dev/null; then apk add --no-cache cmake ninja p7zip; fi
      - name: Build with bundled minizip
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISTBUILD=ON \
            -DCMAKE_TOOLCHAIN_FILE=src/platform/psp2/CMakeToolchain.vitasdk \
            -DUSE_LIBZIP=OFF \
            -DUSE_MINIZIP=OFF \
            -DUSE_LZMA=OFF
          cmake --build build --parallel 2

          rm -rf stage
          mkdir -p stage
          find build -type f \( -name '*.vpk' -o -name '*.self' -o -name 'mgba.elf' \) -exec cp -v {} stage/ \;
          cp LICENSE README.md stage/
          test -n "$(find stage -maxdepth 1 -type f \( -name '*.vpk' -o -name '*.self' -o -name 'mgba.elf' \) -print -quit)"
          7z a -t7z -mx=9 -ms=on mGBA-FRLG-RevA-vita.7z ./stage/*
          ls -lh mGBA-FRLG-RevA-vita.7z
      - uses: actions/upload-artifact@v4
        with:
          name: vita-release
          path: mGBA-FRLG-RevA-vita.7z
          if-no-files-found: error
      - name: Publish Vita asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" mGBA-FRLG-RevA-vita.7z --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
