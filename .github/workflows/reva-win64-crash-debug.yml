name: Debug FRLG RevA Windows GUI startup crash

on:
  push:
    branches:
      - revA-bootstrap
    paths:
      - .github/workflows/reva-win64-crash-debug.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reva-win64-crash-debug
  cancel-in-progress: true

jobs:
  crash-debug:
    runs-on: windows-2022
    steps:
      - name: Checkout exact RevA source
        uses: actions/checkout@v4
        with:
          ref: revA
          fetch-depth: 0

      - name: Verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'fadbf93a565a5bd0b3e7f12b848fc208064a94f1'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "revA moved: $actual" }

      - name: Set up static MinGW64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-static
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-openssl

      - name: Configure symbolized static build
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/mingw64/qt5-static/bin:/mingw64/bin:$PATH"

          HIDDEN=/mingw64/lib/.reva-hidden-import-libs
          mkdir -p "$HIDDEN"
          for name in ssl crypto zstd z; do
            imp="/mingw64/lib/lib${name}.dll.a"
            [[ -f "$imp" ]] && mv "$imp" "$HIDDEN/"
          done

          cmake -S . -B build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH=/mingw64/qt5-static \
            -DQt5_DIR=/mingw64/qt5-static/lib/cmake/Qt5 \
            -DFORCE_QT_VERSION=5 \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO='-O1 -g3 -DNDEBUG' \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O1 -g3 -DNDEBUG' \
            -DCMAKE_EXE_LINKER_FLAGS='-static -static-libgcc -static-libstdc++' \
            -DDISTBUILD=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DBUILD_LTO=OFF \
            -DBUILD_QT=ON \
            -DBUILD_SDL=ON \
            -DBUILD_GL=ON \
            -DBUILD_GLES2=OFF \
            -DBUILD_GLES3=OFF \
            -DUSE_EPOXY=ON \
            -DEPOXY_LIBRARIES=/mingw64/lib/libepoxy.a \
            -DEPOXY_INCLUDE_DIRS=/mingw64/include \
            -DUSE_ZLIB=ON \
            -DZLIB_LIBRARY=/mingw64/lib/libz.a \
            -DZLIB_LIBRARY_RELEASE=/mingw64/lib/libz.a \
            -DZLIB_INCLUDE_DIR=/mingw64/include \
            -DUSE_PNG=ON \
            -DPNG_LIBRARY=/mingw64/qt5-static/lib/libqtlibpng.a \
            -DPNG_LIBRARY_RELEASE=/mingw64/qt5-static/lib/libqtlibpng.a \
            -DPNG_PNG_INCLUDE_DIR=/mingw64/include \
            -DSDL2_LIBRARIES_TEMP=/mingw64/lib/libSDL2.a \
            -DSDL2MAIN_LIBRARY=/mingw64/lib/libSDL2main.a \
            -DUSE_MINIZIP=OFF \
            -DUSE_FFMPEG=OFF \
            -DUSE_LIBZIP=OFF \
            -DUSE_LZMA=OFF \
            -DUSE_ELF=OFF \
            -DUSE_LUA=OFF \
            -DUSE_SQLITE3=OFF \
            -DUSE_JSON_C=OFF \
            -DUSE_DISCORD_RPC=OFF

          if grep -qiE 'lib(ssl|crypto|zstd|z)(-[^/ ]+)?\.dll\.a' build-debug/build.ninja; then
            echo 'Debug build still contains DLL import libraries' >&2
            exit 1
          fi

      - name: Build symbolized Qt executable
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/mingw64/qt5-static/bin:/mingw64/bin:$PATH"
          cmake --build build-debug --target mgba-qt --parallel 2
          ls -lh build-debug/mGBA.exe
          objdump -p build-debug/mGBA.exe | awk '/DLL Name:/ {print $3}' | tee pe-imports.txt

      - name: Capture GDB startup crash
        shell: msys2 {0}
        run: |
          set -u
          # Keep /usr/bin so mkdir/timeout/cp remain available while prioritizing
          # the same MinGW/Qt runtime environment used to build the binary.
          export PATH="/mingw64/qt5-static/bin:/mingw64/bin:/usr/bin:/c/Windows/System32:/c/Windows"
          mkdir -p diagnostics
          cat > diagnostics/gdb.cmd <<'EOF'
          set pagination off
          set confirm off
          set print thread-events off
          handle SIGPIPE nostop noprint pass
          run
          echo \n===== REGISTERS =====\n
          info registers
          echo \n===== CRASH THREAD =====\n
          bt full
          echo \n===== ALL THREADS =====\n
          thread apply all bt
          quit
          EOF

          set +e
          timeout 45s gdb.exe -q -batch -x diagnostics/gdb.cmd --args "$(pwd -W)\\build-debug\\mGBA.exe" > diagnostics/gdb-backtrace.txt 2>&1
          rc=$?
          set -e
          echo "gdb/timeout exit=$rc"
          cat diagnostics/gdb-backtrace.txt
          cp pe-imports.txt diagnostics/pe-imports.txt
          # This is a diagnostic job: the backtrace itself is the output.
          exit 0

      - name: Upload crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reva-win64-crash-backtrace
          path: diagnostics
          if-no-files-found: error
